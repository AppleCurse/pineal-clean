[package]
name = "pineal_heretic_core"
version = "5.0.0"
edition = "2021"
authors = ["Pineal-Heretic Team"]
description = "Core Rust engine for Pineal-Heretic v5.0 - Memory-safe, type-secure agent orchestration"

[lib]
name = "pineal_heretic_core"
path = "src/lib.rs"

[dependencies]
# Cryptography & Security
age = "0.10"
argon2 = "0.5"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = { version = "1.7", features = ["derive"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1.77"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Network
reqwest = { version = "0.11", features = ["json"] }

# Logging
tracing = "0.1"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID for task isolation
uuid = { version = "1.0", features = ["v4", "serde"] }
ndarray = "0.17.2"
md5 = "0.8.1"

# Tauri
tauri = { version = "2" }

[dev-dependencies]
tokio-test = "0.4"
tracing-subscriber = "0.3"
tempfile = "3.0"
