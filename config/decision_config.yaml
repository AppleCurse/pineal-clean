# Decision & Uncertainty Engine Configuration
version: "1.0"

pipeline:
  # Pipeline genelinde geçerli olan varsayılanlar
  default:
    min_data_score: 0.60
    min_llm_confidence: 0.65
    graceful_degradation: true
    # [BOSS-8] Ajan başına duvar saati sınırı. Görev sınırı 300s
    # (backend/api.py PINEAL_TASK_TIMEOUT_SECONDS); tek ajanın LLM zinciri
    # teorik en kötüde 405s sürebildiği için sınır görev bütçesinin ALTINDA
    # olmalıdır — aksi hâlde görev iptal edilip baştan koşar (3x maliyet).
    agent_timeout_seconds: 120

  # Kritik ajanlar - Bunlardan herhangi biri başarısız olursa 
  # pipeline "halted_critical" olarak bitebilir
  critical_agents:
    - mirror_truth
    - passion_mapper

agents:
  # The deterministic 7-pillar bundle is the pipeline's evidence foundation.
  # Do not report a completed profile when this foundation fails.
  pineal_7pillar:
    graceful_degradation: false
    # Deterministik motor: LLM çağrısı yok, kısa sınır yeter.
    timeout_seconds: 60

  depth_analyst:
    # En ağır LLM ajanı (kanıt zincirinin tamamını okur).
    timeout_seconds: 150

  passion_mapper:
    min_data_score: 0.57
    min_llm_confidence: 0.70
    graceful_degradation: true
    field_weights:
      core_passions: 0.30
      energizing_topics: 0.25
      flow_triggers: 0.20
      evidence_quotes: 0.15
      sentiment_polarity: 0.10
    empty_list_penalty: 0.12

  mirror_truth:
    min_llm_confidence: 0.65
    min_data_score: 0.60
    field_weights:
      user_core_frequency: 0.3
      surface_persona: 0.3
      alignment_score: 0.2
      authentic_anchors: 0.2
    empty_list_penalty: 0.08

  friction_detector:
    min_data_score: 0.55
    min_llm_confidence: 0.60
    graceful_degradation: true

  shadow_executor:
    min_data_score: 0.52
    min_llm_confidence: 0.60
    graceful_degradation: true
    field_weights:
      dark_profile: 0.30
      strategy: 0.25
      nlp_sequence: 0.25
      message: 0.20
    empty_list_penalty: 0.08

  osint_investigator:
    min_data_score: 0.40
    min_llm_confidence: 0.55
    graceful_degradation: true
    field_weights:
      associated_platforms: 0.30
      digital_footprint_score: 0.25
      connected_emails: 0.20
      connected_phones: 0.15
      dark_web_hits: 0.10
    empty_list_penalty: 0.05
