[build]
builder = "docker"
dockerfilePath = "Dockerfile"

[deploy]
# ⚠ SINGLE INSTANCE ONLY: app.state.rooms ve rate-limit sayaçları process-local.
# 2+ replica → state ayrışması → WebSocket kopukluğu + rate-limit bypass.
# Yatay ölçekleme için paylaşımlı session store (Redis vb.) gerektirir.
numReplicas = 1
healthcheckPath = "/health"
# /health: "ready" ve "degraded" → HTTP 200 (servis ayakta);
# "failed" → HTTP 503 → Railway container'ı unhealthy sayar ve yeniden başlatır.
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# Persistent volumes — Railway dashboard'da ayrıca tanımlanmalıdır:
# Service → Volumes → Mount Path: /app/memory  (kritik: kanıt zinciri)
# Service → Volumes → Mount Path: /app/cache   (opsiyonel: response cache)
[deploy.volumes]
memory = "/app/memory"
vault = "/app/vault-data"
