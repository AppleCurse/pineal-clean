name: 9Router Preflight Verification

on:
  schedule:
    - cron: '0 */6 * * *'  # Her 6 saatte bir periyodik denetim
  workflow_dispatch:

jobs:
  preflight-probe:
    runs-on: self-hosted  # 9Router yerel proxy'sine (127.0.0.1:20128) erişebilen self-hosted runner
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx python-dotenv

      - name: Execute 9Router Preflight Probe
        run: |
          python scripts/preflight_9router.py
