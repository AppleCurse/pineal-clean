name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt ruff pytest pytest-asyncio
      - name: Lint with ruff
        run: |
          ruff check .
      - name: Run backend tests
        run: |
          PYTHONPATH=. pytest -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Check Svelte types
        run: npm run check
      - name: Build frontend
        run: npm run build
      - name: Verify real Svelte build
        run: |
          grep -q "PINEAL-HERETIC" dist/assets/*.js

  smoke:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: uvicorn smoke
        run: |
          PYTHONPATH=. uvicorn backend.api:app --port 8000 &
          for i in $(seq 1 30); do curl -sf "http://127.0.0.1:8000/api/telemetry?client_id=ci" && break || sleep 1; done
          curl -sf "http://127.0.0.1:8000/" | grep -q 'id="app"'
          curl -s -o /dev/null -w "%{http_code}" -X POST "http://127.0.0.1:8000/api/aspasia/chat" -H 'Content-Type: application/json' -d '{"client_id":"ci","user_message":"hi"}' | grep -q 200
