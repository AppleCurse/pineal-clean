services:
  pineal:
    build:
      context: .
      # Playwright indirme aynası (build-time). .env'e örn:
      #   PLAYWRIGHT_DOWNLOAD_HOST=https://cdn.npmmirror.com/binaries/playwright
      # [AUDIT 2026-09-11 P0] VITE_PINEAL_TOKEN build arg'ı kaldırıldı:
      # server secret'ı bundle'a gömülmez. UI token'ı çalışma zamanında
      # Kasa ekranından girer (localStorage). Token girilmezse arayüz
      # dürüst 401 mesajı gösterir (bkz. RUNBOOK "401 tüm API çağrıları").
      args:
        PLAYWRIGHT_DOWNLOAD_HOST: ${PLAYWRIGHT_DOWNLOAD_HOST:-}
    ports:
      - "8000:8000"
    env_file:
      - path: .env    # yoksa sorun değil: cp .env.example .env ile oluşturun
        required: false
    environment:
      - PINEAL_PORT=8000
      # [AUDIT R2] env_file'daki PINEAL_ENV, imajdaki ENV PINEAL_ENV=production'ı
      # EZİYORDU: reponun kendi önerdiği "cp .env.example .env" akışı (example
      # içinde PINEAL_ENV=development) konteyneri sessizce development moduna
      # sokuyor, fail-closed auth KAPANIYORDU. Compose önceliği
      # environment > env_file olduğundan üretim profili burada açıkça sabitlenir
      # (host env PINEAL_ENV devralınır; .env artık yalnız PINEAL_TOKEN vb. taşır).
      # Yerel geliştirme için tek istisna yol: PINEAL_ENV=development ile başlatın.
      - PINEAL_ENV=${PINEAL_ENV:-production}
    volumes:
      - pineal_memory:/app/memory      # kalıcı kanıt/öğrenme belleği (kritik - kayıp = veri kaybı)
      - pineal_cache:/app/cache        # SQLite response cache (kaybedilebilir; yeniden doldurulur)
      - pineal_vault:/app/vault-data   # (isteğe bağlı) vault dışa aktarımı
    # ⚠ MULTI-REPLICA DESTEKLENMEZ: app.state.rooms ve rate-limit sayaçları
    # process-local tutulur. 2+ instance aynı anda çalıştırılamaz.
    # Yatay ölçekleme: paylaşımlı session store (Redis vb.) gerektirir.
    deploy:
      replicas: 1
    restart: unless-stopped

volumes:
  pineal_memory:
  pineal_cache:
  pineal_vault:
